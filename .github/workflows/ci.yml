name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUTF8: '1'

jobs:
  native:
    name: Native contracts ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install verified build and development locks
        run: python scripts/ci_create_environment.py --development
      - name: Installation, integrity, and authentication regression tests
        run: >-
          python -m pytest -q
          tests/test_compatibility.py tests/test_setup_manager.py
          tests/test_docker_setup.py tests/test_docker_lifecycle.py
          tests/test_install_state.py tests/test_state_backup.py
          tests/test_release_guard.py tests/test_release_package.py
          tests/test_portable_install.py tests/test_platform_config.py
          tests/test_platform_matrix.py tests/test_guided_install_contract.py
          tests/test_ci_contract.py tests/test_cli_doctor.py
          tests/test_dependency_locks.py tests/test_runtime_paths.py ops/tests/test_dashboard_auth.py
      - name: Real Linux prerequisite plan without mutation
        if: runner.os == 'Linux'
        shell: bash
        run: bash install.sh --dry-run --no-start
      - name: Real Windows prerequisite plan without mutation
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -DryRun -NoStart

  frontend:
    name: Frontend Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build-only
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  native-install:
    name: Native install integration ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Supply only locked runner dependencies
        run: python scripts/ci_create_environment.py
      - name: Actual native install, owned stop, unchanged-stage resume
        run: python scripts/ci_native_install.py

  package:
    name: Candidate source ZIP
    runs-on: ubuntu-latest
    needs: [native, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_release.py --output d3m0n-source-candidate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: d3m0n-source-candidate
          path: d3m0n-source-candidate.zip

  docker-clean-install:
    name: Disposable Docker install and acceptance
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: d3m0n-source-candidate
          path: .
      - name: Actual clean checkout install and isolated state acceptance
        run: python scripts/ci_docker_install.py --project d3m0n-ci-checkout
      - name: Extract complete candidate ZIP
        run: python -m zipfile -e d3m0n-source-candidate.zip extracted
      - name: Actual clean ZIP build, install, auth, proxy, tests, and restart
        run: python scripts/ci_docker_install.py --root extracted/D3m0n_Android_Controller --project d3m0n-ci-zip

  release:
    name: Gated source release ZIP
    runs-on: ubuntu-latest
    needs: [native, frontend, native-install, docker-clean-install]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write proof only after all installation gates pass
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('ci-proof.json').write_text(json.dumps({
              'status': 'success', 'workflow': os.environ['GITHUB_WORKFLOW'],
              'commit': os.environ['GITHUB_SHA'], 'docker_acceptance': True,
              'native_acceptance': True,
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Package and verify final source artifact
        run: |
          python scripts/package_release.py --release --ci-proof ci-proof.json --output d3m0n-source.zip
          python -m zipfile -e d3m0n-source.zip extracted
          python scripts/release_guard.py extracted/D3m0n_Android_Controller
      - uses: actions/upload-artifact@v4
        with:
          name: d3m0n-source-zip
          path: d3m0n-source.zip
